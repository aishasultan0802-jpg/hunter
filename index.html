<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ovçu v19.0 - Auto Diagnostic Edition</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #1a1a1a;
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; user-select: none;
            -webkit-user-select: none;
        }
        
        #main-wrapper { 
            display: flex; 
            gap: 20px; 
            align-items: flex-start; 
            flex-wrap: wrap; 
            justify-content: center;
            padding: 15px;
            max-width: 100%;
            box-sizing: border-box;
        }
        
        #login-screen {
            background: #ffffff; padding: 20px 25px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); text-align: center;
            width: 100%; max-width: 380px; border: 4px solid #4caf50; box-sizing: border-box;
        }
        #login-screen h2 { color: #2e7d32; font-size: 32px; margin-top: 5px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 3px solid #c5e1a5; border-radius: 8px; font-size: 16px; outline: none; box-sizing: border-box;}
        input:focus { border-color: #4caf50; }
        .btn { background-color: #ff9100; color: white; border: none; padding: 14px 40px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 5px 0 #b36600; width: 90%; }
        .btn:hover { background-color: #ffa726; }
        
        .eco-warning {
            background-color: #f1f8e9; border-left: 5px solid #81c784;
            padding: 12px; margin: 20px 0 15px 0; border-radius: 4px;
            text-align: left; font-size: 13px; color: #33691e; line-height: 1.5;
        }
        .eco-warning strong { color: #c62828; display: block; margin-bottom: 4px; font-size: 14px; }
        
        .author-credits {
            font-size: 11px; color: #777; margin-top: 20px; 
            font-style: italic; border-top: 1px dashed #ddd; padding-top: 10px;
        }
        
        #scoreboard {
            background: #fff; width: 100%; max-width: 560px; padding: 20px; border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 4px solid #0288d1;
            max-height: 400px; overflow-y: auto; box-sizing: border-box;
        }
        #scoreboard h3 { margin-top: 0; color: #0288d1; text-align: center; text-transform: uppercase; border-bottom: 2px solid #b3e5fc; padding-bottom: 10px; margin-bottom: 10px; }
        
        .score-header { display: flex; font-weight: bold; background: #e1f5fe; padding: 8px 5px; border-radius: 5px; color: #0288d1; font-size: 12px; text-transform: uppercase; margin-bottom: 5px; }
        .col-num { width: 30px; text-align: center; }
        .col-name { flex-grow: 1; text-align: left; padding-left: 5px; }
        .col-title { width: 110px; text-align: center; }
        .col-score { width: 60px; text-align: center; }
        .col-medal { width: 50px; text-align: center; }

        .score-row { display: flex; align-items: center; padding: 10px 5px; border-bottom: 1px dashed #eee; font-size: 13px; }
        .score-row:last-child { border: none; }
        .num-slot { font-weight: bold; color: #555; text-align: center; display: inline-block; width: 100%; }
        .score-name { font-weight: bold; color: #333; word-break: break-word; }
        .score-title-cell { font-size: 11px; color: #555; font-weight: bold; text-align: center; display: inline-block; width: 100%; background: #f1f8e9; padding: 3px 0; border-radius: 12px; border: 1px solid #dcedc8; }
        .score-points { color: #f57c00; font-weight: bold; text-align: center; display: inline-block; width: 100%; }
        .medal-slot { font-size: 18px; font-weight: bold; text-align: center; display: inline-block; width: 100%; }

        #game-container { 
            display: none; 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            max-width: 1180px; 
            max-height: 562px; 
            background: #63c7ff; 
            overflow: hidden; 
            border: 4px solid #fff; 
            border-radius: 12px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
            box-sizing: border-box;
            touch-action: none; 
        }
        
        @media (pointer: fine) {
            #game-container { cursor: none; }
        }
        
        #level-announcer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); z-index: 200;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; font-size: 36px; font-weight: bold; text-transform: uppercase;
            text-shadow: 0 5px 10px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #level-announcer .sub-text { font-size: 18px; color: #ffeb3b; margin-top: 15px; letter-spacing: 2px; }
        
        #bonus-popup {
            position: absolute; color: #ffd700; font-size: 26px; font-weight: bold;
            text-shadow: 0 0 10px #ff6a00, 2px 2px 2px #000; z-index: 150;
            pointer-events: none; transform: translate(-50%, -50%); display: none;
            animation: floatUp 1.2s ease-out forwards;
        }
        #combo-alert {
            position: absolute; top: 35%; left: 50%; transform: translateX(-50%) scale(0.5);
            font-size: 42px; font-weight:900; color: #fff; z-index: 160;
            text-shadow: 0 0 20px #ff00ff, 0 0 30px #00ffff, 3px 3px 0 #000;
            pointer-events: none; display: none; opacity: 0;
        }
        .combo-animate { animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes popIn {
            0% { opacity: 0; transform: translateX(-50%) scale(0.3); }
